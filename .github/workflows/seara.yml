name: Seara

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rulare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MOTOR_REPO }}
          token: ${{ secrets.MOTOR_TOKEN }}
      - uses: ./.github/actions/pregatire
        with:
          env-local: ${{ secrets.RAPOARTE_ENV }}
          gsc: ${{ secrets.GSC_OAUTH_JSON }}
      - name: Rulare
        env:
          REGULI_DATABASE_URL: ${{ secrets.REGULI_DATABASE_URL }}
        run: |
          cd web && npx tsx scripts/raport-zilnic.ts >/dev/null
