name: Saptamanal

on:
  schedule:
    - cron: '7 7 * * 1'
    - cron: '7 8 1 * *'
  workflow_dispatch:
    inputs:
      mod:
        type: choice
        options: [luni, strategie]
        default: luni

permissions:
  contents: read

jobs:
  rulare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MOTOR_REPO }}
          token: ${{ secrets.MOTOR_TOKEN }}
      - uses: ./.github/actions/pregatire
        with:
          env-local: ${{ secrets.RAPOARTE_ENV }}
          gsc: ${{ secrets.GSC_OAUTH_JSON }}
      - name: Rulare
        env:
          REGULI_DATABASE_URL: ${{ secrets.REGULI_DATABASE_URL }}
          MOD: ${{ inputs.mod || (github.event.schedule == '7 8 1 * *' && 'strategie' || 'luni') }}
        run: |
          cd web && npx tsx scripts/raport-periodic.ts "$MOD" >/dev/null
